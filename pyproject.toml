[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsac"
version = "0.1.0"
description = "Version, lint and deploy Amazon QuickSight analyses and dashboards as code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qsac = "qsac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
